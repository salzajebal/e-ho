<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="120" rx="24" fill="#1a3a6b"/>
  <rect width="120" height="120" rx="24" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e4d9b"/>
      <stop offset="100%" stop-color="#0f2d6b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="22" y1="0" x2="98" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Bar chart columns -->
  <rect x="22" y="72" width="14" height="20" rx="3" fill="#3b82f6" opacity="0.7"/>
  <rect x="42" y="58" width="14" height="34" rx="3" fill="#3b82f6" opacity="0.85"/>
  <rect x="62" y="44" width="14" height="48" rx="3" fill="#60a5fa"/>
  <rect x="82" y="30" width="14" height="62" rx="3" fill="#93c5fd"/>

  <!-- Trending line -->
  <polyline points="29,68 49,52 69,38 89,24" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow tip -->
  <polygon points="89,24 96,28 84,32" fill="#93c5fd"/>

  <!-- Bottom baseline -->
  <line x1="18" y1="96" x2="102" y2="96" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- L text mark (subtle) -->
  <text x="10" y="18" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#60a5fa" opacity="0.6">LI</text>
</svg>
