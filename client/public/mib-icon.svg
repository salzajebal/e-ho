<svg width="76" height="76" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mfav-bg" x1="0" y1="0" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C0F07"/>
      <stop offset="50%" stop-color="#120906"/>
      <stop offset="100%" stop-color="#0A0503"/>
    </linearGradient>
    <radialGradient id="mfav-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C9892A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5523" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mfav-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E08A"/>
      <stop offset="35%" stop-color="#D4A045"/>
      <stop offset="70%" stop-color="#A8701E"/>
      <stop offset="100%" stop-color="#7A4E12" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mfav-gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C060" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9B6B1A" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="mfav-bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E08A"/>
      <stop offset="100%" stop-color="#9B6B1A" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="mfav-bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDD070"/>
      <stop offset="100%" stop-color="#8B5A18" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="mfav-bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7E08A"/>
      <stop offset="100%" stop-color="#A07020" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="mfav-rim" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#D4A045" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#8B5A20" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4A045" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="mfav-barglow" x="-40%" y="-30%" width="180%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mfav-textglow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="76" height="76" rx="16" fill="url(#mfav-bg)"/>
  <rect width="76" height="76" rx="16" fill="url(#mfav-glow)"/>

  <rect x="16" y="48" width="7" height="14" rx="1.5" fill="url(#mfav-bar1)"/>
  <rect x="27" y="37" width="7" height="25" rx="1.5" fill="url(#mfav-bar2)"/>
  <rect x="38" y="25" width="7" height="37" rx="1.5" fill="url(#mfav-bar3)" filter="url(#mfav-barglow)"/>

  <polyline
    points="19.5,46 30.5,35 41.5,23"
    stroke="url(#mfav-gold2)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#mfav-barglow)"
  />
  <polygon points="41.5,23 47,27 44,30.5" fill="#F7E08A" opacity="0.95" filter="url(#mfav-barglow)"/>

  <text
    x="56"
    y="55"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="11"
    font-weight="800"
    letter-spacing="0.5"
    fill="url(#mfav-gold)"
    text-anchor="middle"
    filter="url(#mfav-textglow)"
  >MIB</text>

  <line x1="8" y1="66" x2="68" y2="66" stroke="url(#mfav-gold2)" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>

  <rect x="1" y="1" width="74" height="74" rx="15" stroke="url(#mfav-rim)" stroke-width="1" fill="none"/>

  <rect x="4" y="4" width="5" height="1.5" rx="0.5" fill="#D4A045" opacity="0.5"/>
  <rect x="4" y="4" width="1.5" height="5" rx="0.5" fill="#D4A045" opacity="0.5"/>
  <rect x="67" y="4" width="5" height="1.5" rx="0.5" fill="#D4A045" opacity="0.5"/>
  <rect x="70.5" y="4" width="1.5" height="5" rx="0.5" fill="#D4A045" opacity="0.5"/>
  <rect x="4" y="70.5" width="5" height="1.5" rx="0.5" fill="#D4A045" opacity="0.5"/>
  <rect x="4" y="67" width="1.5" height="5" rx="0.5" fill="#D4A045" opacity="0.5"/>
  <rect x="67" y="70.5" width="5" height="1.5" rx="0.5" fill="#D4A045" opacity="0.5"/>
  <rect x="70.5" y="67" width="1.5" height="5" rx="0.5" fill="#D4A045" opacity="0.5"/>
</svg>
