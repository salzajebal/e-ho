<svg width="76" height="76" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1205"/>
    </linearGradient>
    <radialGradient id="gglow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8a6010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ggold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d88a"/>
      <stop offset="35%" stop-color="#c9a84c"/>
      <stop offset="70%" stop-color="#9a7020"/>
      <stop offset="100%" stop-color="#6e4e10"/>
    </linearGradient>
    <linearGradient id="ggold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="100%" stop-color="#9b6b1a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="grim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a045" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8b5a20" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4a045" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="ggf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="76" height="76" rx="16" fill="url(#gbg)"/>
  <rect width="76" height="76" rx="16" fill="url(#gglow)"/>

  <!-- Hexagonal gem shape centered -->
  <polygon
    points="38,14 54,23 54,41 38,50 22,41 22,23"
    fill="none"
    stroke="url(#ggold)"
    stroke-width="1.8"
    stroke-linejoin="round"
    filter="url(#ggf)"
  />
  <!-- Inner facets -->
  <polygon points="38,14 54,23 38,32" fill="#c9a84c" fill-opacity="0.22"/>
  <polygon points="38,14 22,23 38,32" fill="#dbb85e" fill-opacity="0.16"/>
  <polygon points="22,23 22,41 38,32" fill="#8a6010" fill-opacity="0.20"/>
  <polygon points="54,23 54,41 38,32" fill="#c9a84c" fill-opacity="0.28"/>
  <polygon points="22,41 38,50 38,32" fill="#dbb85e" fill-opacity="0.18"/>
  <polygon points="54,41 38,50 38,32" fill="#c9a84c" fill-opacity="0.14"/>
  <!-- Center highlight -->
  <circle cx="38" cy="32" r="3" fill="#f0d88a" fill-opacity="0.65" filter="url(#ggf)"/>
  <!-- Top sparkle -->
  <line x1="38" y1="10" x2="38" y2="14" stroke="#f0d88a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="36" y1="11.5" x2="40" y2="11.5" stroke="#f0d88a" stroke-width="0.8" stroke-linecap="round"/>

  <!-- "G" text at bottom -->
  <text
    x="38"
    y="68"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="10"
    font-weight="700"
    letter-spacing="1.5"
    fill="url(#ggold)"
    text-anchor="middle"
    filter="url(#ggf)"
  >GEMINI</text>

  <!-- Border rim -->
  <rect x="1" y="1" width="74" height="74" rx="15" stroke="url(#grim)" stroke-width="1" fill="none"/>

  <!-- Corner accents -->
  <rect x="4" y="4" width="5" height="1.5" rx="0.5" fill="#c9a84c" opacity="0.5"/>
  <rect x="4" y="4" width="1.5" height="5" rx="0.5" fill="#c9a84c" opacity="0.5"/>
  <rect x="67" y="4" width="5" height="1.5" rx="0.5" fill="#c9a84c" opacity="0.5"/>
  <rect x="70.5" y="4" width="1.5" height="5" rx="0.5" fill="#c9a84c" opacity="0.5"/>
  <rect x="4" y="70.5" width="5" height="1.5" rx="0.5" fill="#c9a84c" opacity="0.5"/>
  <rect x="4" y="67" width="1.5" height="5" rx="0.5" fill="#c9a84c" opacity="0.5"/>
  <rect x="67" y="70.5" width="5" height="1.5" rx="0.5" fill="#c9a84c" opacity="0.5"/>
  <rect x="70.5" y="67" width="1.5" height="5" rx="0.5" fill="#c9a84c" opacity="0.5"/>
</svg>
